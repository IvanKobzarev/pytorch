[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smanager"
dynamic = ["version"]
description = "Slurm job management web UI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
smanager = "smanager.server:main"

[tool.hatch.version]
path = "smanager/_version.py"

[tool.hatch.build.hooks.custom]
