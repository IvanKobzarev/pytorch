[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smanager"
version = "0.1.0"
description = "Slurm job management web UI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
smanager = "smanager.server:main"
