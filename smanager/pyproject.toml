[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smanager"
dynamic = ["version"]
description = "Slurm job management web UI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "zstandard>=0.20.0",
    "plattli>=0.5.2",
]

[project.scripts]
smanager = "smanager.server:main"

[tool.hatch.version]
source = "code"
path = "get_version.py"
expression = "get_git_version('.')"

[tool.hatch.build.hooks.custom]
