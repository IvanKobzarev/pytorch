<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sManager Report</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #333333;
            --border: #dddddd;
            --header-bg: #f7f7f9;
            --input-bg: #ffffff;
            --accent: #4bc0c8;
            --muted: #666666;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121417;
                --text: #f0f3f9;
                --border: rgba(255, 255, 255, 0.08);
                --header-bg: rgb(32 34 37);
                --input-bg: rgba(255, 255, 255, 0.06);
                --accent: #4bc0c8;
                --muted: #9aa4b1;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100%;
        }
        aside {
            border-right: 1px solid var(--border);
            background: var(--header-bg);
            padding: 14px;
            overflow: auto;
        }
        main { min-width: 0; min-height: 0; }
        h1 { font-size: 17px; margin-bottom: 4px; line-height: 1.25; }
        h2 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; }
        a { color: inherit; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .muted { color: var(--muted); }
        .mono { font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Mono", monospace; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            margin: 2px 3px 2px 0;
            background: var(--input-bg);
        }
        .run {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px;
            margin: 4px 0;
            background: var(--input-bg);
        }
        .run-links { display: flex; gap: 8px; margin-top: 4px; color: var(--muted); }
        .versions { display: flex; flex-wrap: wrap; gap: 4px; }
        .download-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 2px;
        }
        .download-link {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            background: var(--input-bg);
        }
        .download-link[hidden] { display: none; }
        .toc {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .toc-link {
            display: block;
            border-radius: 4px;
            padding: 3px 6px;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        .toc-link:hover {
            background: var(--input-bg);
            text-decoration: none;
        }
        .toc-h2 {
            position: relative;
            padding-left: 20px;
            color: var(--muted);
        }
        .toc-h2::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 0.8em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.7;
            transform: translateY(-50%);
        }
        .version-link {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            background: var(--input-bg);
        }
        .version-link.active { border-color: var(--accent); color: var(--accent); }
        iframe { width: 100%; height: 100vh; border: 0; display: block; background: #fff; }
        .error { color: #ef4444; padding: 12px; }
    </style>
</head>
<body>
    <aside>
        <h1 id="title">Report</h1>
        <div class="muted mono" id="reportId"></div>
        <div class="muted" id="uploaded"></div>
        <div class="download-links">
            <a class="download-link" id="downloadHtml" href="#" download>Download HTML</a>
            <a class="download-link" id="downloadSrc" href="#" download hidden>Download Source</a>
        </div>
        <section id="tocSection" hidden>
            <h2>Contents</h2>
            <div class="toc" id="toc"></div>
        </section>
        <h2>XIDs</h2>
        <div id="xids"></div>
        <h2>Runs</h2>
        <div id="runs"></div>
        <h2>Versions</h2>
        <div class="versions" id="versions"></div>
    </aside>
    <main id="main">
        <iframe id="reportFrame" sandbox="allow-scripts"></iframe>
    </main>
    <script>
        const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const pathMatch = location.pathname.match(/^\/reports\/([^/]+)(?:\/v(\d+))?\/?$/);
        const reportId = decodeURIComponent(pathMatch?.[1] || '');
        const explicitVersion = pathMatch?.[2] || '';

        function reportApiPath(suffix = '') {
            const base = `/api/reports/${encodeURIComponent(reportId)}`;
            return explicitVersion ? `${base}/v${explicitVersion}${suffix}` : `${base}${suffix}`;
        }

        function reportVersionApiPath(version, suffix = '') {
            return `/api/reports/${encodeURIComponent(reportId)}/v${version}${suffix}`;
        }

        function link(path, text, cls = '') {
            return `<a class="${cls}" href="${path}">${esc(text)}</a>`;
        }

        function reportViewerScript() {
            return `<script>
(() => {
    const usedIds = new Set();
    const headings = Array.from(document.querySelectorAll('h1,h2')).map((heading, index) => {
        const text = (heading.textContent || '').trim().replace(/\\s+/g, ' ');
        if (!text) return null;
        let id = heading.id;
        if (!id || usedIds.has(id)) {
            let suffix = 1;
            id = 'smanager-toc-' + (index + 1);
            while (document.getElementById(id) || usedIds.has(id)) {
                suffix++;
                id = 'smanager-toc-' + (index + 1) + '-' + suffix;
            }
            heading.id = id;
        }
        usedIds.add(id);
        return {id, text, level: heading.tagName.toLowerCase()};
    }).filter(Boolean);

    parent.postMessage({type: 'smanager-report-toc', headings}, '*');
    window.addEventListener('message', event => {
        if (event.source !== parent) return;
        const data = event.data || {};
        if (data.type !== 'smanager-scroll-to-heading') return;
        const heading = document.getElementById(data.id);
        if (heading) heading.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
})();
</` + `script>`;
        }

        function withReportViewerScript(html) {
            const script = reportViewerScript();
            return /<\/body\s*>/i.test(html) ? html.replace(/<\/body\s*>(?![\s\S]*<\/body\s*>)/i, match => script + match) : html + script;
        }

        function renderToc(headings) {
            const section = document.getElementById('tocSection');
            const toc = document.getElementById('toc');
            headings = headings.filter(h => h && (h.level === 'h1' || h.level === 'h2') && h.id && h.text);
            section.hidden = !headings.length;
            toc.innerHTML = headings.map(h =>
                `<a class="toc-link ${h.level === 'h2' ? 'toc-h2' : 'toc-h1'}" href="#${encodeURIComponent(h.id)}" data-toc-id="${esc(h.id)}">${esc(h.text)}</a>`
            ).join('');
        }

        document.getElementById('toc').addEventListener('click', e => {
            const link = e.target.closest('[data-toc-id]');
            if (!link) return;
            e.preventDefault();
            document.getElementById('reportFrame')?.contentWindow?.postMessage(
                {type: 'smanager-scroll-to-heading', id: link.dataset.tocId},
                '*',
            );
        });

        window.addEventListener('message', e => {
            const frame = document.getElementById('reportFrame');
            if (e.source !== frame?.contentWindow || e.data?.type !== 'smanager-report-toc') return;
            renderToc(e.data.headings || []);
        });

        function renderMeta(meta) {
            document.title = `${meta.title || meta.report_id} - sManager`;
            document.getElementById('title').textContent = meta.title || meta.report_id;
            document.getElementById('reportId').textContent = `${meta.report_id}/v${meta.version}`;
            document.getElementById('uploaded').textContent = `${meta.uploader || ''} ${meta.uploaded_at || ''}`.trim();
            const download = document.getElementById('downloadHtml');
            download.href = reportVersionApiPath(meta.version, '/html');
            download.download = `${meta.report_id}-v${meta.version}.html`;
            const sourceDownload = document.getElementById('downloadSrc');
            sourceDownload.hidden = !meta.source_material;
            sourceDownload.href = reportVersionApiPath(meta.version, '/src');
            sourceDownload.download = `${meta.report_id}-v${meta.version}-src.zip`;
            document.getElementById('xids').innerHTML = (meta.xids || []).map(xid =>
                `<span class="pill mono">${link('/#' + encodeURIComponent(xid), xid)}</span>`
            ).join('') || '<span class="muted">None</span>';
            document.getElementById('runs').innerHTML = (meta.runs || []).map(run => `
                <div class="run">
                    <div class="mono">${esc(run.raw || `${run.xid}/${run.name}`)}</div>
                    <div class="run-links">
                        ${link('/#' + encodeURIComponent(run.xid), 'XID')}
                        ${run.wid !== undefined ? link(`/files/${encodeURIComponent(run.xid)}/wu/${encodeURIComponent(run.wid)}`, 'Files') : ''}
                        ${run.wid !== undefined ? link(`/config/${encodeURIComponent(run.xid)}/${encodeURIComponent(run.wid)}`, 'Config') : ''}
                    </div>
                </div>
            `).join('') || '<span class="muted">None</span>';
        }

        async function loadVersions(activeVersion) {
            const resp = await fetch(`/api/reports/${encodeURIComponent(reportId)}/versions`);
            if (!resp.ok) return;
            const data = await resp.json();
            document.getElementById('versions').innerHTML = (data.versions || []).map(meta => {
                const path = `/reports/${encodeURIComponent(reportId)}/v${meta.version}`;
                return link(path, `v${meta.version}`, `version-link ${meta.version === activeVersion ? 'active' : ''}`);
            }).join('');
        }

        async function loadReport() {
            try {
                const metaResp = await fetch(reportApiPath());
                if (!metaResp.ok) throw new Error('Report metadata not found');
                const meta = await metaResp.json();
                renderMeta(meta);
                loadVersions(meta.version);

                const htmlResp = await fetch(reportVersionApiPath(meta.version, '/html'));
                if (!htmlResp.ok) throw new Error('Report HTML not found');
                renderToc([]);
                document.getElementById('reportFrame').srcdoc = withReportViewerScript(await htmlResp.text());
            } catch (e) {
                document.getElementById('main').innerHTML = `<div class="error">${esc(e.message)}</div>`;
            }
        }

        loadReport();
    </script>
</body>
</html>
