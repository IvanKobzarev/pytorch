<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Code Browser</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #333333;
            --border: #dddddd;
            --hover: #e6f2ff;
            --tree-bg: #f7f7f9;
            --accent: #4bc0c8;
            --muted: #666666;
            --highlight: #fffbcc;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121417;
                --text: #f0f3f9;
                --border: rgba(255, 255, 255, 0.08);
                --hover: rgba(75, 192, 200, 0.15);
                --tree-bg: #1a1d21;
                --accent: #4bc0c8;
                --muted: #9aa4b1;
                --highlight: rgba(255, 251, 204, 0.15);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        .header .xid {
            color: var(--accent);
            font-family: ui-monospace, monospace;
        }
        .header .path {
            color: var(--muted);
            font-family: ui-monospace, monospace;
            font-size: 12px;
        }
        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .tree-panel {
            width: 280px;
            min-width: 200px;
            max-width: 500px;
            background: var(--tree-bg);
            border-right: 1px solid var(--border);
            overflow: auto;
            padding: 8px 0;
            resize: horizontal;
        }
        .content-panel {
            flex: 1;
            overflow: auto;
            padding: 0;
        }
        .tree-item {
            display: flex;
            align-items: center;
            padding: 3px 8px 3px 0;
            cursor: pointer;
            white-space: nowrap;
        }
        .tree-item:hover {
            background: var(--hover);
        }
        .tree-item.selected {
            background: var(--hover);
            font-weight: 500;
        }
        .tree-icon {
            width: 16px;
            text-align: center;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-children {
            display: none;
        }
        .tree-children.expanded {
            display: block;
        }
        .code-view {
            font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Mono", monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre;
            padding: 8px 0;
            min-width: fit-content;
        }
        .code-line {
            display: flex;
            padding: 0 12px;
        }
        .code-line:hover {
            background: var(--hover);
        }
        .code-line.highlighted {
            background: var(--highlight);
        }
        .code-line:target {
            background: var(--highlight);
        }
        .line-num {
            color: var(--muted);
            text-align: right;
            padding-right: 16px;
            min-width: 50px;
            user-select: none;
            flex-shrink: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .line-num:hover {
            color: var(--accent);
        }
        .line-content {
            flex: 1;
        }
        .loading {
            padding: 40px;
            color: var(--muted);
            text-align: center;
        }
        .error {
            padding: 20px;
            color: #ef4444;
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Source: <span class="xid" id="xidDisplay"></span></h1>
        <span class="path" id="pathDisplay"></span>
    </div>
    <div class="container">
        <div class="tree-panel" id="treePanel">
            <div class="loading">Loading file tree...</div>
        </div>
        <div class="content-panel" id="contentPanel">
            <div class="empty-state">Select a file to view its contents</div>
        </div>
    </div>

    <script>
        // Parse URL: /code/{xid}/{file_path}#L{line}
        const pathMatch = window.location.pathname.match(/^\/code\/([^\/]+)(?:\/(.+))?$/);
        const xid = pathMatch ? pathMatch[1] : '';
        const initialFilePath = pathMatch && pathMatch[2] ? decodeURIComponent(pathMatch[2]) : null;
        const hashMatch = window.location.hash.match(/^#L(\d+)$/);
        const initialLine = hashMatch ? parseInt(hashMatch[1]) : null;

        document.getElementById('xidDisplay').textContent = xid;
        document.title = `Source: ${xid}`;

        let selectedPath = null;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUrl(filePath, line) {
            let url = `/code/${xid}`;
            if (filePath) {
                url += `/${filePath}`;
            }
            if (line) {
                url += `#L${line}`;
            }
            history.replaceState(null, '', url);
        }

        function renderTree(items, depth = 0) {
            let html = '';
            for (const item of items) {
                const indent = depth * 16 + 8;
                const icon = item.type === 'dir' ? '📁' : '📄';

                html += `<div class="tree-item" style="padding-left: ${indent}px" data-path="${escapeHtml(item.path)}" data-type="${item.type}">`;
                if (item.type === 'dir') {
                    html += `<span class="tree-icon expand-icon">▶</span>`;
                } else {
                    html += `<span class="tree-icon">&nbsp;</span>`;
                }
                html += `<span class="tree-icon">${icon}</span>`;
                html += `<span class="tree-name">${escapeHtml(item.name)}</span>`;
                html += `</div>`;

                if (item.type === 'dir' && item.children) {
                    html += `<div class="tree-children" data-parent="${escapeHtml(item.path)}">`;
                    html += renderTree(item.children, depth + 1);
                    html += `</div>`;
                }
            }
            return html;
        }

        function expandToPath(panel, filePath) {
            // Expand all parent directories to reveal the file
            const parts = filePath.split('/');
            let currentPath = '';
            for (let i = 0; i < parts.length - 1; i++) {
                currentPath += (i > 0 ? '/' : '') + parts[i];
                const children = panel.querySelector(`.tree-children[data-parent="${CSS.escape(currentPath)}"]`);
                const item = panel.querySelector(`.tree-item[data-path="${CSS.escape(currentPath)}"]`);
                if (children) {
                    children.classList.add('expanded');
                }
                if (item) {
                    const expandIcon = item.querySelector('.expand-icon');
                    if (expandIcon) expandIcon.textContent = '▼';
                }
            }

            // Select the file
            const fileItem = panel.querySelector(`.tree-item[data-path="${CSS.escape(filePath)}"]`);
            if (fileItem) {
                panel.querySelectorAll('.tree-item').forEach(i => i.classList.remove('selected'));
                fileItem.classList.add('selected');
                fileItem.scrollIntoView({ block: 'center' });
            }
        }

        async function loadTree() {
            try {
                const resp = await fetch(`/api/xid/${xid}/code/tree`);
                if (!resp.ok) throw new Error('Failed to load tree');
                const data = await resp.json();

                const panel = document.getElementById('treePanel');
                panel.innerHTML = renderTree(data.tree);

                // Add click handlers
                panel.addEventListener('click', (e) => {
                    const item = e.target.closest('.tree-item');
                    if (!item) return;

                    const path = item.dataset.path;
                    const type = item.dataset.type;

                    if (type === 'dir') {
                        // Toggle directory
                        const children = panel.querySelector(`.tree-children[data-parent="${CSS.escape(path)}"]`);
                        const expandIcon = item.querySelector('.expand-icon');
                        if (children) {
                            children.classList.toggle('expanded');
                            if (expandIcon) {
                                expandIcon.textContent = children.classList.contains('expanded') ? '▼' : '▶';
                            }
                        }
                    } else {
                        // Load file
                        loadFile(path);
                        // Update selection
                        panel.querySelectorAll('.tree-item').forEach(i => i.classList.remove('selected'));
                        item.classList.add('selected');
                    }
                });

                // If we have an initial file path, expand to it and load it
                if (initialFilePath) {
                    expandToPath(panel, initialFilePath);
                    await loadFile(initialFilePath, initialLine);
                }
            } catch (e) {
                document.getElementById('treePanel').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }

        async function loadFile(path, scrollToLine = null) {
            selectedPath = path;
            document.getElementById('pathDisplay').textContent = path;
            updateUrl(path, scrollToLine);

            const panel = document.getElementById('contentPanel');
            panel.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const resp = await fetch(`/api/xid/${xid}/code/file/${encodeURIComponent(path)}`);
                if (!resp.ok) throw new Error('Failed to load file');
                const content = await resp.text();

                const lines = content.split('\n');
                let html = '<div class="code-view">';
                for (let i = 0; i < lines.length; i++) {
                    const lineNum = i + 1;
                    const isHighlighted = scrollToLine === lineNum;
                    html += `<div class="code-line${isHighlighted ? ' highlighted' : ''}" id="L${lineNum}">`;
                    html += `<a class="line-num" href="#L${lineNum}" onclick="handleLineClick(event, ${lineNum})">${lineNum}</a>`;
                    html += `<span class="line-content">${escapeHtml(lines[i])}</span>`;
                    html += `</div>`;
                }
                html += '</div>';
                panel.innerHTML = html;

                // Scroll to highlighted line
                if (scrollToLine) {
                    const lineEl = document.getElementById(`L${scrollToLine}`);
                    if (lineEl) {
                        lineEl.scrollIntoView({ block: 'center' });
                    }
                }
            } catch (e) {
                panel.innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }

        function handleLineClick(event, lineNum) {
            event.preventDefault();
            // Update URL with line number
            updateUrl(selectedPath, lineNum);
            // Remove previous highlight
            document.querySelectorAll('.code-line.highlighted').forEach(el => el.classList.remove('highlighted'));
            // Add highlight to clicked line
            const lineEl = document.getElementById(`L${lineNum}`);
            if (lineEl) {
                lineEl.classList.add('highlighted');
            }
        }

        // Handle hash changes (e.g., back/forward navigation)
        window.addEventListener('hashchange', () => {
            const match = window.location.hash.match(/^#L(\d+)$/);
            if (match) {
                const lineNum = parseInt(match[1]);
                document.querySelectorAll('.code-line.highlighted').forEach(el => el.classList.remove('highlighted'));
                const lineEl = document.getElementById(`L${lineNum}`);
                if (lineEl) {
                    lineEl.classList.add('highlighted');
                    lineEl.scrollIntoView({ block: 'center' });
                }
            }
        });

        loadTree();
    </script>
</body>
</html>
