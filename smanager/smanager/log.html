<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23121417'/><text x='50%25' y='70%25' font-size='11' text-anchor='middle' fill='%234bc0c8' font-family='serif'>≣</text></svg>">
    <title>Log Viewer</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #333333;
            --border: #dddddd;
            --hover: #e6f2ff;
            --accent: #4bc0c8;
            --muted: #666666;
            --highlight: rgba(255, 251, 204, 0.5);
            --ansi-black: #1e1e1e;
            --ansi-red: #c53030;
            --ansi-green: #16a34a;
            --ansi-yellow: #a16207;
            --ansi-blue: #2563eb;
            --ansi-magenta: #9333ea;
            --ansi-cyan: #0891b2;
            --ansi-white: #6b7280;
            --ansi-bright-black: #4b5563;
            --ansi-bright-red: #ef4444;
            --ansi-bright-green: #22c55e;
            --ansi-bright-yellow: #ca8a04;
            --ansi-bright-blue: #3b82f6;
            --ansi-bright-magenta: #a855f7;
            --ansi-bright-cyan: #06b6d4;
            --ansi-bright-white: #9ca3af;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #121417;
                --text: #f0f3f9;
                --border: rgba(255, 255, 255, 0.08);
                --hover: rgba(75, 192, 200, 0.15);
                --accent: #4bc0c8;
                --muted: #9aa4b1;
                --highlight: rgba(255, 251, 204, 0.15);
                --ansi-black: #555555;
                --ansi-red: #f87171;
                --ansi-green: #4ade80;
                --ansi-yellow: #fbbf24;
                --ansi-blue: #60a5fa;
                --ansi-magenta: #c084fc;
                --ansi-cyan: #22d3ee;
                --ansi-white: #e5e7eb;
                --ansi-bright-black: #6b7280;
                --ansi-bright-red: #fca5a5;
                --ansi-bright-green: #86efac;
                --ansi-bright-yellow: #fde68a;
                --ansi-bright-blue: #93c5fd;
                --ansi-bright-magenta: #d8b4fe;
                --ansi-bright-cyan: #67e8f9;
                --ansi-bright-white: #f9fafb;
            }
        }
        :root[data-theme="dark"] {
            --bg: #121417;
            --text: #f0f3f9;
            --border: rgba(255, 255, 255, 0.08);
            --hover: rgba(75, 192, 200, 0.15);
            --accent: #4bc0c8;
            --muted: #9aa4b1;
            --highlight: rgba(255, 251, 204, 0.15);
            --ansi-black: #555555;
            --ansi-red: #f87171;
            --ansi-green: #4ade80;
            --ansi-yellow: #fbbf24;
            --ansi-blue: #60a5fa;
            --ansi-magenta: #c084fc;
            --ansi-cyan: #22d3ee;
            --ansi-white: #e5e7eb;
            --ansi-bright-black: #6b7280;
            --ansi-bright-red: #fca5a5;
            --ansi-bright-green: #86efac;
            --ansi-bright-yellow: #fde68a;
            --ansi-bright-blue: #93c5fd;
            --ansi-bright-magenta: #d8b4fe;
            --ansi-bright-cyan: #67e8f9;
            --ansi-bright-white: #f9fafb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        .header .jid {
            color: var(--accent);
            font-family: ui-monospace, monospace;
        }
        .header .info {
            color: var(--muted);
            font-size: 12px;
            margin-left: auto;
        }
        .header a {
            color: var(--accent);
            text-decoration: none;
        }
        .header a:hover {
            text-decoration: underline;
        }
        .content {
            flex: 1;
            overflow: auto;
        }
        .log-view {
            font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Mono", monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre;
            padding: 8px 0;
            min-width: fit-content;
        }
        .log-line {
            display: flex;
            padding: 0 12px;
        }
        .log-line:hover {
            background: var(--hover);
        }
        .log-line:target, .log-line.selected {
            background: var(--highlight);
        }
        .line-num {
            color: var(--muted);
            text-align: right;
            padding-right: 16px;
            min-width: 60px;
            user-select: none;
            flex-shrink: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .line-num:hover {
            color: var(--accent);
        }
        .line-content {
            flex: 1;
        }
        .loading {
            padding: 40px;
            color: var(--muted);
            text-align: center;
        }
        .error {
            padding: 20px;
            color: #ef4444;
        }
        /* ANSI colors */
        .ansi-black { color: var(--ansi-black); }
        .ansi-red { color: var(--ansi-red); }
        .ansi-green { color: var(--ansi-green); }
        .ansi-yellow { color: var(--ansi-yellow); }
        .ansi-blue { color: var(--ansi-blue); }
        .ansi-magenta { color: var(--ansi-magenta); }
        .ansi-cyan { color: var(--ansi-cyan); }
        .ansi-white { color: var(--ansi-white); }
        .ansi-bright-black { color: var(--ansi-bright-black); }
        .ansi-bright-red { color: var(--ansi-bright-red); }
        .ansi-bright-green { color: var(--ansi-bright-green); }
        .ansi-bright-yellow { color: var(--ansi-bright-yellow); }
        .ansi-bright-blue { color: var(--ansi-bright-blue); }
        .ansi-bright-magenta { color: var(--ansi-bright-magenta); }
        .ansi-bright-cyan { color: var(--ansi-bright-cyan); }
        .ansi-bright-white { color: var(--ansi-bright-white); }
        .ansi-bold { font-weight: bold; }
        .ansi-dim { opacity: 0.7; }
        .ansi-italic { font-style: italic; }
        .ansi-underline { text-decoration: underline; }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 16px;
        }
        .filter-group label {
            color: var(--muted);
            font-size: 12px;
        }
        .filter-input {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            width: 180px;
        }
        .filter-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .filter-input.invalid {
            border-color: #ef4444;
        }
        .regex-toggle {
            font-family: ui-monospace, monospace;
            font-size: 11px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--muted);
            cursor: pointer;
        }
        .regex-toggle:hover {
            border-color: var(--accent);
        }
        .regex-toggle.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .log-line.hidden {
            display: none;
        }
        .theme-toggle {
            display: flex;
            gap: 0;
            margin-left: 8px;
        }
        .theme-toggle button {
            font-size: 11px;
            padding: 3px 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--muted);
            cursor: pointer;
        }
        .theme-toggle button:first-child { border-radius: 4px 0 0 4px; }
        .theme-toggle button:last-child { border-radius: 0 4px 4px 0; }
        .theme-toggle button:not(:first-child) { border-left: none; }
        .theme-toggle button:hover { color: var(--text); }
        .theme-toggle button.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .theme-toggle button.active + button { border-left-color: var(--accent); }
    </style>
</head>
<body>
    <div class="header">
        <h1><span style="color:var(--accent)">s</span>Manager <span style="font-size: 10px; opacity: 0.3;">v{{VERSION}}</span></h1>
        <span>Log for job <span class="jid" id="jidDisplay"></span></span>
        <div class="filter-group">
            <label>filter:</label>
            <input type="text" class="filter-input" id="filterInput" placeholder="[rank0]">
            <button class="regex-toggle" id="regexToggle" title="Toggle regex mode">.*</button>
        </div>
        <span class="info" id="lineCount"></span>
        <div class="theme-toggle" id="themeToggle">
            <button data-theme="light">Light</button>
            <button data-theme="auto" class="active">Auto</button>
            <button data-theme="dark">Dark</button>
        </div>
    </div>
    <div class="content" id="content">
        <div class="loading">Loading log...</div>
    </div>

    <script>
        const jid = window.location.pathname.split('/').pop();
        document.getElementById('jidDisplay').textContent = jid;
        document.title = `Log: ${jid}`;

        // Theme toggle
        const savedTheme = localStorage.getItem('log-theme') || 'auto';
        function applyTheme(theme) {
            document.documentElement.removeAttribute('data-theme');
            if (theme !== 'auto') document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('#themeToggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.theme === theme);
            });
            localStorage.setItem('log-theme', theme);
        }
        applyTheme(savedTheme);
        document.getElementById('themeToggle').addEventListener('click', e => {
            if (e.target.dataset.theme) applyTheme(e.target.dataset.theme);
        });

        // ANSI code to CSS class mapping
        const ANSI_COLORS = {
            30: 'ansi-black', 31: 'ansi-red', 32: 'ansi-green', 33: 'ansi-yellow',
            34: 'ansi-blue', 35: 'ansi-magenta', 36: 'ansi-cyan', 37: 'ansi-white',
            90: 'ansi-bright-black', 91: 'ansi-bright-red', 92: 'ansi-bright-green', 93: 'ansi-bright-yellow',
            94: 'ansi-bright-blue', 95: 'ansi-bright-magenta', 96: 'ansi-bright-cyan', 97: 'ansi-bright-white',
        };
        const ANSI_STYLES = {
            1: 'ansi-bold', 2: 'ansi-dim', 3: 'ansi-italic', 4: 'ansi-underline',
        };

        let rawLines = [];

        function parseAnsi(text) {
            // First escape HTML
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Parse ANSI escape sequences: \x1b[...m or \033[...m
            const regex = /\x1b\[([0-9;]*)m/g;
            let result = '';
            let lastIndex = 0;
            let currentClasses = [];

            let match;
            while ((match = regex.exec(text)) !== null) {
                // Add text before this escape sequence
                if (match.index > lastIndex) {
                    const chunk = text.slice(lastIndex, match.index);
                    if (currentClasses.length > 0) {
                        result += `<span class="${currentClasses.join(' ')}">${chunk}</span>`;
                    } else {
                        result += chunk;
                    }
                }
                lastIndex = regex.lastIndex;

                // Parse the codes
                const codes = match[1].split(';').map(c => parseInt(c) || 0);
                for (const code of codes) {
                    if (code === 0) {
                        currentClasses = [];  // Reset
                    } else if (ANSI_COLORS[code]) {
                        // Remove any existing color class and add new one
                        currentClasses = currentClasses.filter(c => !c.startsWith('ansi-') || c.startsWith('ansi-bold') || c.startsWith('ansi-dim') || c.startsWith('ansi-italic') || c.startsWith('ansi-underline'));
                        currentClasses.push(ANSI_COLORS[code]);
                    } else if (ANSI_STYLES[code]) {
                        if (!currentClasses.includes(ANSI_STYLES[code])) {
                            currentClasses.push(ANSI_STYLES[code]);
                        }
                    }
                }
            }

            // Add remaining text
            if (lastIndex < text.length) {
                const chunk = text.slice(lastIndex);
                if (currentClasses.length > 0) {
                    result += `<span class="${currentClasses.join(' ')}">${chunk}</span>`;
                } else {
                    result += chunk;
                }
            }

            return result;
        }

        async function loadLog() {
            const content = document.getElementById('content');
            try {
                const resp = await fetch(`/api/log/${jid}`);
                if (!resp.ok) throw new Error('Log not found');
                const text = await resp.text();
                const lines = text.split('\n');
                rawLines = lines;

                document.getElementById('lineCount').textContent = `${lines.length} lines`;

                const html = lines.map((line, i) => {
                    const num = i + 1;
                    const colored = parseAnsi(line);
                    return `<div class="log-line" id="L${num}"><a class="line-num" href="#L${num}">${num}</a><span class="line-content">${colored}</span></div>`;
                }).join('');

                content.innerHTML = `<div class="log-view">${html}</div>`;

                // Scroll to bottom, or to hash if specified
                if (window.location.hash) {
                    const target = document.querySelector(window.location.hash);
                    if (target) {
                        target.classList.add('selected');
                        target.scrollIntoView({block: 'center'});
                    }
                } else {
                    content.scrollTop = content.scrollHeight;
                }
            } catch (e) {
                content.innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }

        loadLog();

        // Handle hash changes (clicking line numbers)
        window.addEventListener('hashchange', () => {
            document.querySelectorAll('.log-line.selected').forEach(el => el.classList.remove('selected'));
        });

        // Filter functionality
        const filterInput = document.getElementById('filterInput');
        const regexToggle = document.getElementById('regexToggle');
        let regexMode = false;
        let debounceTimer = null;

        regexToggle.addEventListener('click', () => {
            regexMode = !regexMode;
            regexToggle.classList.toggle('active', regexMode);
            filterInput.classList.remove('invalid');
            if (!regexMode) applyFilter();
            else validateRegex();
        });

        function validateRegex() {
            const pattern = filterInput.value;
            if (!pattern) {
                filterInput.classList.remove('invalid');
                return true;
            }
            try {
                new RegExp(pattern);
                filterInput.classList.remove('invalid');
                return true;
            } catch {
                filterInput.classList.add('invalid');
                return false;
            }
        }

        function applyFilter() {
            const pattern = filterInput.value;
            const lines = document.querySelectorAll('.log-line');
            let visibleCount = 0;

            if (!pattern) {
                lines.forEach(el => { el.classList.remove('hidden'); visibleCount++; });
            } else if (regexMode) {
                if (!validateRegex()) return;
                const re = new RegExp(pattern);
                lines.forEach((el, i) => {
                    const matches = re.test(rawLines[i] || '');
                    el.classList.toggle('hidden', !matches);
                    if (matches) visibleCount++;
                });
            } else {
                lines.forEach((el, i) => {
                    const matches = (rawLines[i] || '').includes(pattern);
                    el.classList.toggle('hidden', !matches);
                    if (matches) visibleCount++;
                });
            }

            const total = lines.length;
            document.getElementById('lineCount').textContent = pattern
                ? `${visibleCount}/${total} lines`
                : `${total} lines`;
        }

        filterInput.addEventListener('input', () => {
            if (regexMode) {
                validateRegex();
            } else {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(applyFilter, 500);
            }
        });

        filterInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && regexMode) applyFilter();
        });

        filterInput.addEventListener('blur', () => {
            if (regexMode) applyFilter();
        });
    </script>
</body>
</html>
