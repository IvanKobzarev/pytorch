name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check if user is authorized
        id: check_auth
        run: |
          COMMENTER="${{ github.event.comment.user.login }}"
          ASSOCIATION="${{ github.event.comment.author_association }}"
          AUTHORIZED=false

          # Org owners and members
          if [ "$ASSOCIATION" = "OWNER" ] || [ "$ASSOCIATION" = "MEMBER" ]; then
            AUTHORIZED=true
          fi

          # CODEOWNERS
          if [ "$AUTHORIZED" = "false" ] && [ -f .github/CODEOWNERS ]; then
            OWNERS=$(grep -oP '(?<=@)\S+' .github/CODEOWNERS | sort -u)
            if echo "$OWNERS" | grep -qxi "$COMMENTER"; then
              AUTHORIZED=true
            fi
          fi

          echo "authorized=$AUTHORIZED" >> "$GITHUB_OUTPUT"
          if [ "$AUTHORIZED" = "false" ]; then
            echo "::notice::User $COMMENTER is not authorized to trigger Claude."
          fi

      - name: Run Claude Code
        id: claude
        if: steps.check_auth.outputs.authorized == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-4-6"
          additional_permissions: |
            actions: read
