name: Run Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  bv2-cpu-test:
    runs-on: 4-core-ubuntu
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --verbose -r bv2/requirements-cpu-stable.txt

    - name: Run CPU tests
      run: python -m pytest -s bv2 -m "not gpu"

  bv2-cpu-test-nightly:
    runs-on: 4-core-ubuntu
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --verbose -r bv2/requirements-cpu-nightly.txt

    - name: Run CPU tests
      run: python -m pytest -s bv2 -m "not gpu"
