name: Run Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  cpu-test:
    runs-on: 4-core-ubuntu
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bv2/requirements.txt

    - name: Run CPU tests
      run: python -m pytest -s bv2 -m "not gpu"

  gpu-test:
    runs-on: 4-core-ubuntu-gpu-t4
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bv2/requirements.txt

    - name: Run GPU tests
      run: python -m pytest -s bv2 -m "gpu"
