name: Ruff

on:
  pull_request:
    branches:
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install ruff
      uses: astral-sh/ruff-action@v3
      with:
        args: "--version"

    - name: check
      run: ruff check bv2/

    - name: imports
      run: ruff check --select I bv2/
